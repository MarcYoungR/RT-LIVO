common:
  img_topic: "/camera/color/image_raw"
  lid_topic: "/livox/mid360/lidar"
  imu_topic: "/livox/mid360/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # LidarToCamera 
  Rcl: [0.0722207,  -0.997387, -0.0020542,
        0.521005,   0.039482,  -0.85264,
        0.850493,  0.060508,   0.522494] 
  Pcl: [-0.0442358, -0.411712, 0.168568]

time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 4
  blind: 1.0

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "Dynamic04"
  pose_output_en: true

pcd_save:
  pcd_save_en: true
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1 

rtdetr:
  enable: true               # 总开关; false 时系统行为等同原始 FAST-LIVO2
  model_name: "model.onnx"   # 模型文件名 (weights 文件夹下)
  conf_thresh: 0.6           # 检测置信度阈值
  padding: 20                # 固定 padding (adaptive_padding 关闭时回退使用)
  time_offset: 0.0           # 检测/发布时间戳偏移 (秒)

  # 运动验证 + 分级处置策略:
  #   HIGH   人(person)/动物(bird..giraffe)  -> 直接删除, 不经光流验证
  #   MEDIUM 载具/车辆(car/bicycle/motorcycle/airplane/bus/train/truck/boat) -> 光流验证后剔除
  #   LOW    树木/桌椅/其它                 -> 保留, 不参与删除
  # (类别->先验映射见 getMotionPrior, 无需在此配置类别列表)
  motion_verify:
    enable: true                 # false 时 MEDIUM 也回退为直接删除(旧逻辑)
    min_track_points: 12         # 框内有效跟踪角点下限, 不足则判为 UNCERTAIN (不删除)
    medium_prior_thresh: 3.0     # MEDIUM(载具)光流运动阈值 (HIGH/LOW 不走光流)
    high_prior_thresh: 1.5       # 预留(HIGH当前直接删, 不使用光流阈值)
    low_prior_thresh: 5.0        # 预留(LOW当前直接保留, 不使用光流阈值)
    # 时序平滑: 抑制单帧判定造成的红/绿框频繁切换 (残留根因)
    temporal_smooth_enable: true # 跨帧 IoU 关联 + MOVING 状态保持
    hold_frames: 5               # 判过 MOVING 后持续保持的帧数 (10Hz 约 0.5s)
    assoc_iou_min: 0.3           # 跨帧候选匹配的 IoU 下限

  # 自适应 padding: 由深度/时间延迟/运动得分决定, 取代固定 padding
  adaptive_padding:
    enable: true                 # false 时使用上方 rtdetr.padding 固定值
    min_px: 4
    max_px: 40
    base_px: 3.0
    vmax: 3.0                    # 假设目标最大速度 (m/s), 用于估算延迟内像素位移
    flow_gain: 0.5               # 运动得分 -> 额外像素 padding 的增益
    detection_time_delay: 0.05   # 检测/传输延迟 (秒)

  # 深度门控: 删除点需同时落在目标框内且深度与目标一致
  depth_gate:
    enable: true                 # false 时回退为纯 2D mask 删除
    min: 0.3                     # 最小深度容差 (米)
    ratio: 0.12                  # 深度容差 = min + ratio * median_depth

  # 旧版自适应协方差 (按动态面积比例), 已弃用, 默认关闭
  adaptive_cov:
    enable: false
    min_value: 200.0
    max_value: 2000.0

  # 可靠性感知协方差: 基于有效视觉约束质量, 取代面积比例法
  reliability_cov:
    enable: true                 # false 时完全不修改 img_point_cov
    min_value: 200.0             # 视觉质量最高时的协方差
    max_value: 2000.0            # 视觉质量最低时的协方差
    expected_visual_points: 80   # 期望的有效视觉点数 (归一化基准)

